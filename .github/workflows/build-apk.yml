name: Build OneOS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: app-android/**/*.gradle*
      - uses: android-actions/setup-android@v3
      - name: Verify GitHub Packages credentials
        run: |
          test -n "$GH_PACKAGES_USER" || { echo 'Missing GH_PACKAGES_USER Actions secret'; exit 1; }
          test -n "$GH_PACKAGES_TOKEN" || { echo 'Missing GH_PACKAGES_TOKEN Actions secret'; exit 1; }
      - name: Build and stage Guest helper APK
        run: ./scripts/build-guest-manager.sh debug
      - name: Build full debug APK
        working-directory: app-android
        run: ./gradlew :app:assembleFullDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: oneos-full-debug
          path: app-android/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
